<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenDesk — Owner login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef2f0; --surface: #ffffff; --ink: #1b2a41; --ink-soft: #52637a;
    --border: #d7ddd9; --voice: #0e7c86; --voice-soft: #e4f3f3; --now-line: #d1393f;
    --radius: 10px;
  }
  html[data-theme="dark"] {
    --paper: #10161b; --surface: #1a2228; --ink: #e8edf0; --ink-soft: #9fb0bb;
    --border: #2a3540; --voice: #39b7bf; --voice-soft: #16343a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #10161b; --surface: #1a2228; --ink: #e8edf0; --ink-soft: #9fb0bb; --border: #2a3540; --voice: #39b7bf; --voice-soft: #16343a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  .card {
    width: 100%; max-width: 380px; margin: 1.5rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem;
  }
  h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 1.5rem; margin: 0 0 0.3rem; }
  p.sub { color: var(--ink-soft); margin: 0 0 1.5rem; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; font-weight: 700; margin: 0.9rem 0 0.3rem; }
  input, select {
    width: 100%; font-family: inherit; font-size: 0.95rem; padding: 0.55rem 0.7rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  input:focus, select:focus { outline: none; border-color: var(--voice); box-shadow: 0 0 0 3px var(--voice-soft); }
  button {
    width: 100%; margin-top: 1.4rem; padding: 0.65rem; border: none; border-radius: 8px;
    background: var(--voice); color: #fff; font-family: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .toggle { margin-top: 1.2rem; text-align: center; font-size: 0.85rem; color: var(--ink-soft); }
  .toggle a { color: var(--voice); cursor: pointer; text-decoration: underline; }
  .error { color: var(--now-line); font-size: 0.85rem; margin-top: 0.8rem; min-height: 1.1em; }
  #signup-fields { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>OpenDesk</h1>
    <p class="sub" id="mode-sub">Owner login</p>

    <form id="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <div id="signup-fields">
        <label for="business">Business</label>
        <select id="business"></select>
      </div>

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="8">

      <button type="submit" id="submit-btn">Log in</button>
      <p class="error" id="error-text"></p>
    </form>

    <p class="toggle" id="toggle-text">Business not set up yet? <a id="toggle-link">Sign up</a></p>
  </div>

<script>
(function () {
  let mode = "login"; // "login" | "signup"

  const form = document.getElementById("auth-form");
  const signupFields = document.getElementById("signup-fields");
  const businessSelect = document.getElementById("business");
  const submitBtn = document.getElementById("submit-btn");
  const errorText = document.getElementById("error-text");
  const modeSub = document.getElementById("mode-sub");
  const toggleText = document.getElementById("toggle-text");
  const toggleLink = document.getElementById("toggle-link");
  const passwordInput = document.getElementById("password");

  async function loadBusinesses() {
    try {
      const res = await fetch("/api/public/businesses");
      const data = await res.json();
      businessSelect.innerHTML = (data.businesses || []).map((b) => `<option value="${b.id}">${b.name}</option>`).join("");
    } catch {
      businessSelect.innerHTML = "";
    }
  }

  function setMode(next) {
    mode = next;
    if (mode === "signup") {
      signupFields.style.display = "block";
      submitBtn.textContent = "Sign up";
      modeSub.textContent = "Create your owner account";
      toggleText.innerHTML = 'Already have an account? <a id="toggle-link">Log in</a>';
      passwordInput.setAttribute("autocomplete", "new-password");
      loadBusinesses();
    } else {
      signupFields.style.display = "none";
      submitBtn.textContent = "Log in";
      modeSub.textContent = "Owner login";
      toggleText.innerHTML = 'Business not set up yet? <a id="toggle-link">Sign up</a>';
      passwordInput.setAttribute("autocomplete", "current-password");
    }
    document.getElementById("toggle-link").addEventListener("click", () => setMode(mode === "signup" ? "login" : "signup"));
  }
  toggleLink.addEventListener("click", () => setMode("signup"));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorText.textContent = "";
    submitBtn.disabled = true;
    try {
      const body = {
        email: document.getElementById("email").value,
        password: passwordInput.value,
      };
      if (mode === "signup") body.businessId = businessSelect.value;
      const res = await fetch(mode === "signup" ? "/api/signup" : "/api/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      window.location.href = "/";
    } catch (err) {
      errorText.textContent = err.message;
      submitBtn.disabled = false;
    }
  });

  // Theme follows the same stamped data-theme attribute the dashboard uses, if a previous visit set one.
  const savedTheme = localStorage.getItem("frontdesk-theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
})();
</script>
</body>
</html>
